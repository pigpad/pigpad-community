name: Store didn't match
description: The extension didn't recognize a store, or matched the wrong one.
title: "[Store match] "
labels: ["store-match", "bug"]
body:
  - type: input
    id: site
    attributes: { label: "Store website (domain only)", placeholder: "example.com" }
    validations: { required: true }
  - type: dropdown
    id: what
    attributes: { label: "What happened", options: ["Not recognized", "Matched the wrong store", "Wrong category", "Other"] }
    validations: { required: true }
  - type: input
    id: expected
    attributes: { label: "What you expected" }
  - type: input
    id: version
    attributes: { label: "Extension version and browser", placeholder: "e.g. 0.1.0 / Chrome 130" }
  - type: input
    id: code
    attributes: { label: "Debug-log code (optional)", placeholder: "PIG-XXXX" }
  - type: textarea
    id: notes
    attributes: { label: "Notes", description: "Don't paste full URLs with order or account details." }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
      - label: I removed personal info (card/account numbers, names, emails, addresses, order numbers).
        required: true
