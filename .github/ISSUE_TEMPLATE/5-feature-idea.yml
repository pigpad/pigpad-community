name: Feature idea
description: Suggest something pigpad should do.
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes: { label: "What problem would this solve?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "Your idea" }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: "Anything you've tried instead?" }
